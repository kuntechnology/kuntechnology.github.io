  <style>
    :root {
      color-scheme: dark;
      --ink: #eee8e1;
      --muted: #a69b98;
      --dim: #746c70;
      --ground: #0b0a0f;
      --line: rgba(227, 213, 204, .17);
      --serif: "Songti SC", "Noto Serif CJK SC", STSong, "Yu Mincho", ui-serif, Georgia, serif;

      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-width: 320px; background: var(--ground); scroll-behavior: smooth; }
    body {
      min-width: 320px; min-height: 100svh; margin: 0; overflow-x: hidden; color: var(--ink);
      background: radial-gradient(ellipse at 72% 47%, rgba(77, 32, 52, .13), transparent 37rem),

      font-family: var(--sans); -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    a:focus-visible { outline: 2px solid #f2b79f; outline-offset: 5px; border-radius: 2px; }
    .skip-link { position: fixed; z-index: 10; top: 12px; left: 12px; padding: 11px 15px; transform: translateY(-160%); color: #171013; background: #f0c6b0; font-weight: 700; text-decoration: none; }
    .skip-link:focus { transform: translateY(0); }
    .ambient { position: fixed; z-index: 0; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: .28; }
    .frame { position: relative; z-index: 1; width: min(1500px, calc(100% - 88px)); margin-inline: auto; }
    .masthead { height: 96px; display: flex; align-items: center; }
    .wordmark { display: inline-flex; align-items: center; gap: 12px; color: #d5cbc4; text-decoration: none; }
    .wordmark-mark { font: 500 21px/1 var(--serif); letter-spacing: -.08em; color: #e8b8a6; }
    .wordmark-name { font: 500 10px/1 var(--mono); letter-spacing: .2em; }
    main { min-height: calc(100svh - 96px); }
    .exhibition {
      min-height: min(820px, calc(100svh - 96px));
      display: grid; grid-template-columns: minmax(255px, .72fr) minmax(0, 1.45fr);
      align-items: center; gap: clamp(32px, 5vw, 84px); padding: 14px 0 48px;
    }
    .copy { grid-column: 1; grid-row: 1; position: relative; z-index: 3; padding: 28px 0 34px; }
    h1 {
      margin: 0; max-width: 440px; color: #f0e9e2; font: 500 clamp(45px, 5.1vw, 76px)/1.18 var(--serif);
      letter-spacing: .025em; text-wrap: balance;
    }
    .index { margin: clamp(52px, 10vh, 112px) 0 0; padding: 0; list-style: none; }
    .index li { border-top: 1px solid var(--line); }
    .index li:last-child { border-bottom: 1px solid var(--line); }
    .index-link {
      min-height: 58px; display: grid; grid-template-columns: 32px 1fr 20px; align-items: center; gap: 11px;
      color: var(--muted); text-decoration: none; transition: color .24s ease, padding .24s ease;
    }
    .index-number { color: var(--dim); font: 10px var(--mono); letter-spacing: .05em; transition: color .24s ease; }
    .index-title { font-size: 13px; letter-spacing: .015em; }
    .index-arrow { justify-self: end; color: #d79d89; font-size: 14px; opacity: 0; transform: translate(-5px, 4px); transition: opacity .24s ease, transform .24s ease; }
    .index-link:hover, .index-link:focus-visible { color: #f3e6dc; padding-inline: 4px; }
    .index-link:hover .index-number, .index-link:focus-visible .index-number { color: #d8a48e; }
    .index-link:hover .index-arrow, .index-link:focus-visible .index-arrow { opacity: 1; transform: translate(0, 0); }
    .artwork-stage {
      grid-column: 2; grid-row: 1; position: relative; justify-self: center; width: min(100%, 850px);
      height: min(77svh, 780px); min-height: 430px; overflow: hidden; isolation: isolate; border-radius: 50%;
      background: radial-gradient(ellipse at 51% 49%, rgba(64, 35, 49, .22), rgba(32, 20, 30, .08) 34%, transparent 69%);
    }
    .artwork-stage::before {
      content: ""; position: absolute; z-index: 0; inset: 7%; border-radius: 50%;
      background: radial-gradient(ellipse at 48% 55%, rgba(184, 101, 90, .08), transparent 58%),
        radial-gradient(ellipse at 57% 41%, rgba(109, 114, 157, .08), transparent 48%);
      filter: blur(18px); pointer-events: none;
    }
    .sculpture, .art-fallback { position: absolute; z-index: 2; inset: 0; display: block; width: 100%; height: 100%; }
    .sculpture { opacity: 0; transition: opacity .9s ease; }
    .art-fallback { z-index: 1; overflow: visible; transform: scale(1.18); transition: opacity .8s ease; }
    .artwork-stage[data-webgl="ready"] .sculpture { opacity: .98; }
    .artwork-stage[data-webgl="ready"] .art-fallback { opacity: 0; visibility: hidden; }
    .art-caption { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .endmark { width: 100%; padding: 0 0 max(25px, env(safe-area-inset-bottom)); color: #71686c; font: 9px var(--mono); letter-spacing: .16em; text-align: right; }
    @media (min-width: 1501px) { .exhibition { gap: 84px; } }
    @media (max-width: 900px) {
      .frame { width: calc(100% - 56px); }
      .exhibition { grid-template-columns: minmax(225px, .78fr) minmax(0, 1.2fr); gap: 25px; }
      .artwork-stage { height: min(70svh, 660px); min-height: 390px; }
      .index-link { min-height: 54px; }
    }
    @media (max-width: 700px) {
      .frame { width: calc(100% - 40px); }
      .masthead { height: 72px; }
      .wordmark { gap: 10px; }
      .wordmark-mark { font-size: 19px; }
      .wordmark-name { font-size: 9px; }
      main { min-height: auto; }
      .exhibition { min-height: auto; display: flex; flex-direction: column; align-items: stretch; gap: 0; padding: 0 0 43px; }
      .artwork-stage { order: 0; align-self: center; width: min(100%, 540px); height: min(112vw, 53svh); min-height: 290px; max-height: 470px; margin: 0 0 2px; }
      .copy { order: 1; padding: 0 0 12px; }
      h1 { font-size: clamp(42px, 11vw, 58px); line-height: 1.2; }
      .index { margin-top: 34px; }
      .index-link { min-height: 62px; grid-template-columns: 34px 1fr 22px; gap: 10px; }
      .index-title { font-size: 14px; }
      .index-arrow { opacity: .72; transform: none; }
      .endmark { padding-top: 0; text-align: left; }
    }
    @media (max-width: 360px) {
      .frame { width: calc(100% - 32px); }
      .artwork-stage { min-height: 274px; }
      .index-link { min-height: 60px; }
      .index-title { font-size: 13px; }
    }
    @media (prefers-reduced-motion: reduce) {

      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
