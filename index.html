<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050b17">
  <meta name="description" content="光在生长。以蓝色地球为中心的数字艺术首页，收录 Kuntechnology 的四个交互作品。">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://kuntechnology.github.io/">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <meta property="og:url" content="https://kuntechnology.github.io/">
  <title>光在生长。 · Kuntechnology</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #e8f2fc;
      --muted: #93a9c1;
      --dim: #647c97;
      --ground: #050b17;
      --line: rgba(151, 190, 226, .18);
      --blue: #78d8ff;
      --blue-bright: #a0e9ff;
      --serif: "Songti SC", "Noto Serif CJK SC", STSong, "Yu Mincho", ui-serif, Georgia, serif;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-width: 320px; background: var(--ground); scroll-behavior: smooth; }
    body {
      min-width: 320px; min-height: 100svh; margin: 0; overflow-x: hidden; color: var(--ink);
      background: radial-gradient(ellipse at 76% 45%, rgba(17, 77, 142, .19), transparent 38rem),
        radial-gradient(ellipse at 18% 105%, rgba(19, 61, 104, .13), transparent 34rem), var(--ground);
      font-family: var(--sans); -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    a:focus-visible { outline: 2px solid var(--blue-bright); outline-offset: 5px; border-radius: 2px; }
    .skip-link { position: fixed; z-index: 10; top: 12px; left: 12px; padding: 11px 15px; transform: translateY(-160%); color: #07101e; background: var(--blue-bright); font-weight: 700; text-decoration: none; }
    .skip-link:focus { transform: translateY(0); }
    .ambient {
      position: fixed; z-index: 0; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: .62;
      background-image:
        radial-gradient(2px 2px at 7% 13%, rgba(176, 219, 247, .9) 99%, transparent 100%),
        radial-gradient(1px 1px at 18% 68%, rgba(133, 190, 230, .72) 99%, transparent 100%),
        radial-gradient(2px 2px at 27% 29%, rgba(207, 231, 249, .8) 99%, transparent 100%),
        radial-gradient(1px 1px at 39% 82%, rgba(140, 197, 235, .72) 99%, transparent 100%),
        radial-gradient(1px 1px at 51% 17%, rgba(188, 221, 245, .76) 99%, transparent 100%),
        radial-gradient(1px 1px at 62% 61%, rgba(138, 192, 229, .7) 99%, transparent 100%),
        radial-gradient(2px 2px at 74% 28%, rgba(202, 229, 248, .82) 99%, transparent 100%),
        radial-gradient(1px 1px at 88% 76%, rgba(147, 203, 238, .74) 99%, transparent 100%),
        radial-gradient(1px 1px at 94% 42%, rgba(201, 230, 249, .8) 99%, transparent 100%);
    }
    .frame { position: relative; z-index: 1; width: min(1420px, calc(100% - 88px)); margin-inline: auto; }
    .masthead { height: 88px; display: flex; align-items: center; }
    .wordmark { display: inline-flex; align-items: center; gap: 12px; color: #cfdeee; text-decoration: none; }
    .wordmark-mark { font: 500 21px/1 var(--serif); letter-spacing: -.08em; color: var(--blue); }
    .wordmark-name { font: 500 10px/1 var(--mono); letter-spacing: .2em; }
    main { min-height: calc(100svh - 88px); }
    .exhibition {
      min-height: min(850px, calc(100svh - 88px));
      display: grid; grid-template-columns: minmax(250px, .72fr) minmax(0, 1.28fr);
      align-items: center; gap: clamp(32px, 5vw, 86px); padding: 8px 0 34px;
    }
    .copy { grid-column: 1; grid-row: 1; position: relative; z-index: 3; padding: 26px 0 28px; }
    .eyebrow { display: flex; align-items: center; gap: 11px; margin: 0 0 26px; color: #8fb4d7; font: 9px/1.4 var(--mono); letter-spacing: .19em; text-transform: uppercase; }
    .eyebrow::before { content: ""; width: 23px; height: 1px; background: #62c8f4; box-shadow: 0 0 12px rgba(78, 195, 250, .7); }
    h1 { margin: 0; max-width: 450px; color: #eaf4ff; font: 500 clamp(45px, 5.2vw, 76px)/1.22 var(--serif); letter-spacing: .025em; text-wrap: balance; }
    .intro { margin: 21px 0 0; color: var(--muted); font-size: 13px; line-height: 1.8; letter-spacing: .035em; }
    .index { margin: clamp(48px, 9vh, 102px) 0 0; padding: 0; list-style: none; }
    .index li { border-top: 1px solid var(--line); }
    .index li:last-child { border-bottom: 1px solid var(--line); }
    .index-link {
      min-height: 58px; display: grid; grid-template-columns: 32px minmax(0, 1fr) 20px; align-items: center; gap: 11px;
      position: relative; isolation: isolate; overflow: hidden; margin-inline: -10px; padding-inline: 10px;
      color: var(--muted); text-decoration: none; transition: color .24s ease, padding .24s ease;
    }
    .index-link::before {
      content: ""; position: absolute; z-index: -1; inset: 1px 0; pointer-events: none; opacity: 0;
      border-left: 1px solid rgba(125, 184, 218, .58);
      background: radial-gradient(circle 190px at var(--link-glow-x, 50%) var(--link-glow-y, 50%), rgba(120, 189, 222, .105), transparent 72%),
        linear-gradient(90deg, rgba(79, 137, 171, .105), rgba(56, 108, 143, .045) 58%, transparent);
      box-shadow: inset 4px 0 13px -10px rgba(146, 218, 247, .74);
      transition: opacity .28s ease;
    }
    .index-number { color: var(--dim); font: 10px var(--mono); letter-spacing: .05em; transition: color .24s ease; }
    .index-title { font-size: 13px; letter-spacing: .015em; }
    .index-arrow { justify-self: end; color: var(--blue); font-size: 14px; opacity: 0; transform: translate(-5px, 4px); transition: opacity .24s ease, transform .24s ease; }
    .index-link:hover, .index-link:focus-visible { color: #e9f6ff; padding-inline: 14px; }
    .index-link:hover::before, .index-link:focus-visible::before { opacity: 1; }
    .index-link:hover .index-number, .index-link:focus-visible .index-number { color: var(--blue); }
    .index-link:hover .index-arrow, .index-link:focus-visible .index-arrow { opacity: 1; transform: translate(0, 0); }
    .artwork-stage {
      grid-column: 2; grid-row: 1; position: relative; justify-self: center; width: min(100%, 790px, 76svh);
      aspect-ratio: 1; isolation: isolate; overflow: hidden;
      background: radial-gradient(ellipse at 50% 50%, rgba(18, 73, 130, .20), rgba(7, 22, 42, .08) 43%, transparent 72%);
    }
    .artwork-stage::before { content: ""; position: absolute; z-index: 0; inset: 4%; border-radius: 50%; background: radial-gradient(circle, rgba(104, 166, 202, .23) 0, rgba(78, 137, 177, .13) 36%, rgba(49, 103, 145, .045) 59%, transparent 76%); filter: blur(34px); pointer-events: none; }
    .orbit-lines, .earth-scene, .globe-fallback { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    .orbit-lines { z-index: 1; overflow: visible; fill: none; stroke: rgba(98, 181, 231, .31); stroke-width: 1; transform: translate3d(calc(var(--camera-x, 0px) * -.28), calc(var(--camera-y, 0px) * -.28), 0); }
    .orbit-lines .orbit-soft { stroke: rgba(91, 157, 209, .17); stroke-width: .8; }
    .orbit-lines .orbit-dash { stroke: rgba(104, 208, 248, .56); stroke-width: 1.15; stroke-dasharray: 3 12; animation: orbit-drift 76s linear infinite; }
    .artwork-stage[data-paused="true"] .orbit-dash { animation-play-state: paused; }
    .orbit-node { fill: #9ce9ff; stroke: rgba(81, 188, 245, .56); stroke-width: 7; paint-order: stroke; filter: drop-shadow(0 0 7px rgba(94, 207, 255, .72)); }
    .globe-fallback { z-index: 2; inset: 16%; width: 68%; height: 68%; border-radius: 50%; overflow: hidden; background: radial-gradient(circle at 36% 31%, #3779a7, #0c3357 49%, #061527 78%); box-shadow: inset -26px -10px 56px rgba(0, 0, 0, .66); transform: translate3d(calc(var(--camera-x, 0px) * .42), calc(var(--camera-y, 0px) * .42), 0); transition: opacity .7s ease, visibility .7s ease; }
    .globe-fallback img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center; filter: saturate(1.14) hue-rotate(4deg) brightness(.82); }
    .globe-fallback::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 32% 29%, rgba(90, 189, 255, .06), transparent 38%), linear-gradient(113deg, rgba(10, 61, 106, .02) 38%, rgba(1, 8, 20, .60) 100%); box-shadow: inset -14px -4px 42px rgba(2, 9, 20, .48), inset 0 0 20px rgba(101, 186, 239, .14); }
    .earth-scene { z-index: 3; opacity: 0; transform: translate3d(calc(var(--camera-x, 0px) * .42), calc(var(--camera-y, 0px) * .42), 0); transition: opacity .8s ease; }
    .artwork-stage[data-webgl="ready"] .earth-scene { opacity: 1; }
    .artwork-stage[data-webgl="ready"] .globe-fallback { opacity: 0; visibility: hidden; }
    .stage-label, .stage-footnote { position: absolute; z-index: 4; color: #a7c6e4; font: 8px/1.5 var(--mono); letter-spacing: .16em; text-transform: uppercase; pointer-events: none; }
    .stage-label { top: 12%; left: 8%; display: flex; align-items: center; gap: 8px; }
    .stage-label::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: #70d9ff; box-shadow: 0 0 11px #55caff; }
    .stage-footnote { right: 8%; bottom: 12%; color: #7898b7; letter-spacing: .11em; }
    .art-caption { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @keyframes orbit-drift { to { stroke-dashoffset: -240; } }
    @media (max-width: 1040px) {
      .frame { width: calc(100% - 56px); }
      .exhibition { grid-template-columns: minmax(220px, .74fr) minmax(0, 1.26fr); gap: 26px; }
      .index-link { min-height: 54px; }
      .stage-label { left: 5%; }
    }
    @media (max-width: 760px) {
      .frame { width: calc(100% - 40px); }
      .masthead { height: 72px; }
      .wordmark { gap: 10px; }
      .wordmark-mark { font-size: 19px; }
      .wordmark-name { font-size: 9px; }
      main { min-height: auto; }
      .exhibition { min-height: auto; display: flex; flex-direction: column; align-items: stretch; gap: 0; padding: 0 0 36px; }
      .artwork-stage { order: 0; align-self: center; width: min(calc(100% + 24px), 560px); aspect-ratio: 1; margin: -3px -12px 5px; }
      .copy { order: 1; padding: 0 0 15px; }
      .eyebrow { margin: 0 0 18px; }
      h1 { font-size: clamp(42px, 10.6vw, 58px); line-height: 1.2; }
      .intro { margin-top: 14px; font-size: 12px; }
      .index { margin-top: 31px; }
      .index-link { min-height: 61px; grid-template-columns: 34px minmax(0, 1fr) 22px; gap: 10px; }
      .index-title { font-size: 14px; }
      .index-arrow { opacity: .76; transform: none; }
    }
    @media (max-width: 380px) {
      .frame { width: calc(100% - 32px); }
      .artwork-stage { width: min(calc(100% + 24px), 560px); }
      .stage-label { top: 10%; left: 4%; font-size: 7px; }
      .stage-footnote { right: 4%; bottom: 10%; font-size: 7px; }
      .index-link { min-height: 59px; }
      .index-title { font-size: 13px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition-duration: .01ms !important; }
    }
  </style>
</head>

        </nav>
      </div>
    </section>
  </main>

</html>
